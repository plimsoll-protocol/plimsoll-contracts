[workspace]
resolver = "2"
members = [
  "crates/types",
  "contracts/reporter-registry",
  "contracts/coverage-ledger",
  "contracts/covered-vault",
  "contracts/upgrade-fixture-registry",
  "contracts/upgrade-fixture-ledger",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/plimsoll-protocol/plimsoll-contracts"

[workspace.dependencies]
soroban-sdk = "29.0.1"
plimsoll-types = { path = "crates/types" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
