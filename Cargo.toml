[workspace]
resolver = "2"
members = [
  "crates/types",
  "contracts/reporter-registry",
  "contracts/coverage-ledger",
  "contracts/covered-vault",
  "contracts/upgrade-fixture-registry",
  "contracts/upgrade-fixture-ledger",
  "tests/e2e",
  "tests/events",
  "examples/coverage-gate",
]
# `tests/e2e` imports the built wasm, so it only compiles after
# `stellar contract build`. Leaving it out of the defaults keeps a plain
# `cargo test` / `cargo clippy` working on a fresh clone; run it with
# `cargo test -p plimsoll-e2e`.
default-members = [
  "crates/types",
  "contracts/reporter-registry",
  "contracts/coverage-ledger",
  "contracts/covered-vault",
  "contracts/upgrade-fixture-registry",
  "contracts/upgrade-fixture-ledger",
  "tests/events",
  "examples/coverage-gate",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/plimsoll-protocol/plimsoll-contracts"

[workspace.dependencies]
soroban-sdk = "29.0.1"
plimsoll-types = { path = "crates/types" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
