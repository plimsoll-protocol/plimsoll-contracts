name: Install Stellar CLI
description: >
  Download the pinned Stellar CLI release, check its SHA-256 against the value
  recorded here, and only then extract it onto PATH.

# Every workflow installs the CLI through this action, so the version and its
# checksum live in exactly one place. To bump them, see "Bumping the Rust
# toolchain and the Stellar CLI" in README.md.
#
# The checksum is the one GitHub records for the release asset
# (`gh api repos/stellar/stellar-cli/releases/tags/v<version>` -> `.digest`),
# confirmed against a local `sha256sum` of the downloaded archive.

runs:
  using: composite
  steps:
    - name: Download, verify and install
      shell: bash
      env:
        STELLAR_CLI_VERSION: "28.1.0"
        STELLAR_CLI_SHA256: "c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462"
      run: |
        set -euo pipefail
        archive="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
        url="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${archive}"
        dir=$(mktemp -d)
        curl -sSfL -o "$dir/$archive" "$url"
        # sha256sum -c exits non-zero, and the step fails, on any mismatch.
        if ! echo "${STELLAR_CLI_SHA256}  $dir/$archive" | sha256sum -c -; then
          echo "::error::Stellar CLI archive checksum mismatch for $archive. Expected ${STELLAR_CLI_SHA256}, got $(sha256sum "$dir/$archive" | cut -d' ' -f1)."
          exit 1
        fi
        tar -xzf "$dir/$archive" -C "$dir" stellar
        install -m 0755 "$dir/stellar" /usr/local/bin/stellar
        rm -rf "$dir"
        stellar --version
