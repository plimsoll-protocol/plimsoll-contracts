name: Set up Rust
description: >
  Install the exact toolchain pinned in rust-toolchain.toml (with its targets
  and components) and fail if the compiler that ends up active is any other.

# rust-toolchain.toml is the only place the Rust version is written down. CI
# reads it from there instead of tracking `stable`, so the compiler that checks
# the wasm size budgets and runs clippy only changes in a commit. To bump it,
# see "Bumping the Rust toolchain and the Stellar CLI" in README.md.

inputs:
  components:
    description: Extra rustup components to add on top of rust-toolchain.toml (space separated).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install the pinned toolchain
      shell: bash
      env:
        EXTRA_COMPONENTS: ${{ inputs.components }}
      run: |
        set -euo pipefail
        pinned=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
        if ! [[ "$pinned" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error file=rust-toolchain.toml::channel must be an exact version such as 1.100.0, found '${pinned}'."
          exit 1
        fi
        # With no argument, rustup (1.28+) installs the toolchain named by
        # rust-toolchain.toml along with its targets and components. Older
        # rustup does the same on `rustup show`.
        rustup toolchain install || rustup show
        for component in $EXTRA_COMPONENTS; do
          rustup component add "$component"
        done
        active=$(rustc --version | cut -d' ' -f2)
        if [ "$active" != "$pinned" ]; then
          echo "::error::rustc $active is active but rust-toolchain.toml pins $pinned."
          exit 1
        fi
        rustc --version
        cargo --version
