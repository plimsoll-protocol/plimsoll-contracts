name: "Bug report"
description: "Report a bug in one of the Plimsoll contracts"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below.

        **If this is a security vulnerability**, do not use this form. Report it privately through GitHub: [Security → Report a vulnerability](https://github.com/plimsoll-protocol/plimsoll-contracts/security/advisories/new).

  - type: dropdown
    id: contract
    attributes:
      label: "Affected contract"
      description: "Which contract is affected?"
      options:
        - reporter-registry
        - coverage-ledger
        - covered-vault
        - plimsoll-types (shared library)
        - Multiple / not sure
    validations:
      required: true

  - type: input
    id: function
    attributes:
      label: "Function"
      description: "Which function is affected? (e.g., set_reporter, post_reserve, is_covered)"
      placeholder: "e.g., post_reserve"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "What happened? What did you expect to happen?"
      placeholder: "Clear description of the bug..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Reproduction steps"
      description: "Steps to reproduce the bug. Include a minimal test case if possible."
      placeholder: |
        1. Deploy contract...
        2. Call function...
        3. Observe...
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      description: "How severe is this bug?"
      options:
        - Critical (funds at risk, auth bypass)
        - High (wrong coverage/is_covered answer)
        - Medium (storage/TTL issue, event mismatch)
        - Low (cosmetic, documentation)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "Where did you encounter this?"
      placeholder: |
        - Network: testnet / mainnet / local sandbox
        - Contract address (if deployed):
        - soroban-sdk version:
        - Stellar CLI version:
    validations:
      required: false

  - type: checkboxes
    id: spec
    attributes:
      label: "SPEC.md"
      description: "Does this bug mean SPEC.md is also wrong?"
      options:
        - label: "Yes, SPEC.md needs an update in the same fix"
          required: false