name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new advisories surface even when nobody opens a PR.
    - cron: "0 6 * * 1"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Install Stellar CLI (checksum verified)
        uses: ./.github/actions/install-stellar-cli
      # soroban-sdk 28 only builds contract wasm under `stellar contract build`.
      # The upgrade tests upload the fixture wasm, so this must run before the
      # tests, not after them.
      - name: Build wasm
        run: stellar contract build --locked
      - name: Check wasm size budgets
        run: python3 scripts/check_wasm_sizes.py
      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh
      - name: Security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2026-0387
      - name: Test
        run: cargo test
      # Every #[contracterror] variant needs a test that asserts it, so a dead
      # or untested code cannot ship. See docs/ERRORS.md.
      - name: Error-code coverage
        run: python3 scripts/check_error_coverage.py
      # tests/e2e loads the wasm built above with contractimport!, so it is not
      # a default workspace member and runs only once that wasm exists.
      - name: Clippy (e2e)
        run: cargo clippy -p plimsoll-e2e --all-targets -- -D warnings
      - name: End-to-end scenario against the built wasm
        run: cargo test -p plimsoll-e2e

  toolchain-matrix:
    name: toolchain (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v7
      - name: Install ${{ matrix.toolchain }} toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test
  error-codes:
    name: error codes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The check reads the enums at the base revision, so it needs the
          # other branch's commits as well as this one's.
          fetch-depth: 0
      - name: Fetch the base branch
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      # The indexer, the app and third-party front ends decode errors by number,
      # so a shipped variant keeps its number forever: new codes are appended
      # and nothing is renumbered or removed (docs/ERRORS.md).
      - name: Errors are append-only
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: python3 scripts/check_error_codes.py --base "origin/${BASE_REF}"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Prints the per-crate table in the log and on the run's summary page.
      - name: Measure coverage
        run: ./scripts/coverage.sh
      - name: Upload lcov report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: target/coverage/lcov.info
          if-no-files-found: error

  tarpaulin:
    name: tarpaulin-coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
  spec-sync:
    name: spec-sync
    runs-on: ubuntu-latest
    # A pull request is the only place a base and a head are both available to
    # compare, and the only place the rule applies: one commit moves both.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # The check diffs the pull request against its merge base, so both
          # sides of the history have to be in the clone.
          fetch-depth: 0
      - name: Check docs/SPEC.md tracks interface changes
        env:
          SPEC_SYNC_BASE: ${{ github.event.pull_request.base.sha }}
          SPEC_SYNC_HEAD: ${{ github.sha }}
        run: ./.github/scripts/check-spec-sync.sh
  wasm-size-report:
    name: wasm size report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      - name: Run cargo-tarpaulin
        run: |
          mkdir -p target/tarpaulin
          cargo tarpaulin --workspace --exclude plimsoll-e2e \
            --branch \
            --out Html --out Json \
            --output-dir target/tarpaulin \
            --fail-under 80
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html-tarpaulin
          path: target/tarpaulin/tarpaulin-report.html
          if-no-files-found: error
      - name: Summarize coverage for PR comment
        if: always() && hashFiles('target/tarpaulin/tarpaulin-report.json') != ''
        id: summary
        shell: python3 {0}
        run: |
          import json, os, pathlib

          data = json.loads(pathlib.Path("target/tarpaulin/tarpaulin-report.json").read_text())
          files = data.get("files", [])
          covered_lines = sum(f.get("covered", 0) for f in files)
          coverable_lines = sum(f.get("coverable", 0) for f in files)
          line_pct = (100.0 * covered_lines / coverable_lines) if coverable_lines else 0.0

          covered_branches = 0
          total_branches = 0
          for f in files:
              for t in f.get("traces", []):
                  stats = t.get("stats") or {}
                  if "Branch" in stats:
                      b = stats["Branch"]
                      covered_branches += int(b.get("covered", 0))
                      total_branches += int(b.get("total", 0))
          branch_pct_str = f"{100.0 * covered_branches / total_branches:.2f}% ({covered_branches}/{total_branches})" if total_branches else "N/A"
          line_pct_str = f"{line_pct:.2f}% ({covered_lines}/{coverable_lines})"

          body = "\n".join([
              "<!-- plimsoll-tarpaulin-coverage -->",
              "## Test Coverage Report (cargo-tarpaulin)",
              "",
              "| Metric | Coverage |",
              "| --- | ---: |",
              f"| Line coverage | {line_pct_str} |",
              f"| Branch coverage | {branch_pct_str} |",
              "",
              f"Minimum line coverage threshold: **80%** ({'PASS' if line_pct >= 80.0 else 'FAIL'}).",
          ])
          pathlib.Path("target/tarpaulin/comment.md").write_text(body)
      - name: Comment PR with coverage summary
        if: always() && github.event_name == 'pull_request' && hashFiles('target/tarpaulin/comment.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('target/tarpaulin/comment.md', 'utf8');
            const marker = '<!-- plimsoll-tarpaulin-coverage -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - uses: ./.github/actions/install-stellar-cli
      - name: Build wasm (PR head)
        run: stellar contract build --locked
      - name: Measure PR wasm sizes
        run: python3 scripts/wasm_size_diff.py measure /tmp/pr-sizes.json
      - name: Build wasm (base branch)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add /tmp/base-ref "$BASE_SHA"
          mkdir -p /tmp/base-ref/scripts
          cp scripts/wasm_size_diff.py /tmp/base-ref/scripts/wasm_size_diff.py
          cd /tmp/base-ref
          stellar contract build --locked
          python3 scripts/wasm_size_diff.py measure /tmp/base-sizes.json
      - name: Generate size report
        run: python3 scripts/wasm_size_diff.py report /tmp/base-sizes.json /tmp/pr-sizes.json /tmp/size-report.md
      - name: Comment on pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/post_wasm_size_comment.sh "${{ github.repository }}" "${{ github.event.pull_request.number }}" /tmp/size-report.md
