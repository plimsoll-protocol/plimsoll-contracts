name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new advisories surface even when nobody opens a PR.
    - cron: "0 6 * * 1"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Install Stellar CLI (checksum verified)
        uses: ./.github/actions/install-stellar-cli
      # soroban-sdk 28 only builds contract wasm under `stellar contract build`.
      # The upgrade tests upload the fixture wasm, so this must run before the
      # tests, not after them.
      - name: Build wasm
        run: stellar contract build --locked
      - name: Check wasm size budgets
        run: python3 scripts/check_wasm_sizes.py
      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh
      - name: Test
        run: cargo test
      # Every #[contracterror] variant needs a test that asserts it, so a dead
      # or untested code cannot ship. See docs/ERRORS.md.
      - name: Error-code coverage
        run: python3 scripts/check_error_coverage.py
      # tests/e2e loads the wasm built above with contractimport!, so it is not
      # a default workspace member and runs only once that wasm exists.
      - name: Clippy (e2e)
        run: cargo clippy -p plimsoll-e2e --all-targets -- -D warnings
      - name: End-to-end scenario against the built wasm
        run: cargo test -p plimsoll-e2e

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Prints the per-crate table in the log and on the run's summary page.
      - name: Measure coverage
        run: ./scripts/coverage.sh
      - name: Upload lcov report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: target/coverage/lcov.info
          if-no-files-found: error
